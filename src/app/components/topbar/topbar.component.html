<div class="layout-topbar">
  <a class="menu-button" (click)="onMenuButtonClick($event)">
    <i class="pi pi-bars"></i>
  </a>

  <ul class="topbar-menu">
    @if (pushSupported) {
      <li>
        <a (click)="togglePush()" [title]="pushSubscribed ? 'Desativar notificacoes' : 'Ativar notificacoes'">
          @if (pushLoading) {
            <i class="pi pi-spin pi-spinner" aria-hidden="true" style="font-size: 1rem"></i>
          } @else {
            <i class="pi" [class.pi-bell]="pushSubscribed" [class.pi-bell-slash]="!pushSubscribed"
               aria-hidden="true" style="font-size: 1rem"></i>
          }
        </a>
      </li>
    }
    <li>
      <a (click)="logout()">
        <i class="pi pi-power-off" aria-hidden="true" style="font-size: 1rem"></i>
      </a>
    </li>
  </ul>
</div>
